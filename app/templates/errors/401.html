{% extends "base.html" %}
{% block title %}401 Unauthorized — SPL{% endblock %}
{% block content %}
<div class="container my-5 text-center">
    <div class="py-5">
        <h1 class="display-1 text-danger fw-bold">401</h1>
        <h3 class="mb-3">Authentication Required</h3>
        <p class="text-muted mb-4">You must be logged in to access this resource.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i>Go to Login</a>
    </div>
</div>
{% endblock %}
